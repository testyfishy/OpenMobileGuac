<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1290" height="2796" viewBox="0 0 1290 2796">
<title>store screenshot: privacy</title>
<defs><linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#6fd6b6"/><stop offset="1" stop-color="#1f6f5c"/></linearGradient></defs>
<defs>
    <radialGradient id="bgg1" cx="0.78" cy="0.35" r="0.65"><stop offset="0" stop-color="#1c5a4b" stop-opacity="0.95"/><stop offset="1" stop-color="#0f1115" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgg2" cx="0.05" cy="1" r="0.6"><stop offset="0" stop-color="#173c4c" stop-opacity="0.7"/><stop offset="1" stop-color="#0f1115" stop-opacity="0"/></radialGradient>
    <pattern id="bgdots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.06"/></pattern>
  </defs>
  <rect width="1290" height="2796" fill="#0f1115"/>
  <rect width="1290" height="2796" fill="url(#bgg1)"/>
  
  
    <text x="645" y="250" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-1.04"><tspan fill="#eceef2">Private by</tspan></text>
<text x="645" y="368.56" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="-1.04"><tspan fill="#eceef2"></tspan><tspan fill="#5cc8a8">design</tspan><tspan fill="#eceef2"></tspan></text>
    <circle cx="188.79999999999998" cy="644" r="34" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(168.79999999999998 624) scale(1.65)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="254.79999999999998" y="660" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#eceef2">No account</text>
      <text x="254.79999999999998" y="730" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="40" fill="#a2a9b6">The app talks only to the servers you add.</text><circle cx="188.79999999999998" cy="944" r="34" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(168.79999999999998 924) scale(1.65)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="254.79999999999998" y="960" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#eceef2">No ads, no tracking</text>
      <text x="254.79999999999998" y="1030" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="40" fill="#a2a9b6">No analytics, ad or tracking SDKs.</text><circle cx="188.79999999999998" cy="1244" r="34" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(168.79999999999998 1224) scale(1.65)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="254.79999999999998" y="1260" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#eceef2">Your keychain</text>
      <text x="254.79999999999998" y="1330" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="40" fill="#a2a9b6">Saved passwords stay in secure storage.</text><circle cx="188.79999999999998" cy="1544" r="34" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(168.79999999999998 1524) scale(1.65)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="254.79999999999998" y="1560" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#eceef2">App lock</text>
      <text x="254.79999999999998" y="1630" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="40" fill="#a2a9b6">Face ID, Touch ID or device passcode.</text><circle cx="188.79999999999998" cy="1844" r="34" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(168.79999999999998 1824) scale(1.65)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="254.79999999999998" y="1860" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="64" font-weight="700" fill="#eceef2">Open source</text>
      <text x="254.79999999999998" y="1930" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="40" fill="#a2a9b6">GPL-3.0. Read it, build it yourself.</text>
    <g id="app-icon"><image x="565" y="2376" width="160" height="160" href="../../brand/banner-icon.svg" xlink:href="../../brand/banner-icon.svg"/></g>
    <text x="645" y="2606" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="44" font-weight="600" fill="#eceef2">Free. No paid tier.</text>
    <text x="645" y="2676" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="32" fill="#a2a9b6">github.com/testyfishy/OpenMobileGuac</text>
