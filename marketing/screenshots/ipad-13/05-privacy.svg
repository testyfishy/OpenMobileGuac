<text x="1032" y="442.272" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="124.8" font-weight="700" letter-spacing="-1.248"><tspan fill="#eceef2"></tspan><tspan fill="#5cc8a8">design</tspan><tspan fill="#eceef2"></tspan></text>
    <circle cx="288.47999999999996" cy="772.8" r="40.8" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(264.47999999999996 748.8) scale(1.9799999999999998)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="367.67999999999995" y="792" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="76.8" font-weight="700" fill="#eceef2">No account</text>
      <text x="367.67999999999995" y="876" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="48" fill="#a2a9b6">The app talks only to the servers you add.</text><circle cx="288.47999999999996" cy="1040" r="40.8" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(264.47999999999996 1016) scale(1.9799999999999998)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="367.67999999999995" y="1059.2" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="76.8" font-weight="700" fill="#eceef2">No ads, no tracking</text>
      <text x="367.67999999999995" y="1143.2" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="48" fill="#a2a9b6">No analytics, ad or tracking SDKs.</text><circle cx="288.47999999999996" cy="1307.2" r="40.8" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(264.47999999999996 1283.2) scale(1.9799999999999998)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="367.67999999999995" y="1326.4" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="76.8" font-weight="700" fill="#eceef2">Your keychain</text>
      <text x="367.67999999999995" y="1410.4" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="48" fill="#a2a9b6">Saved passwords stay in secure storage.</text><circle cx="288.47999999999996" cy="1574.3999999999999" r="40.8" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(264.47999999999996 1550.3999999999999) scale(1.9799999999999998)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="367.67999999999995" y="1593.6" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="76.8" font-weight="700" fill="#eceef2">App lock</text>
      <text x="367.67999999999995" y="1677.6" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="48" fill="#a2a9b6">Face ID, Touch ID or device passcode.</text><circle cx="288.47999999999996" cy="1841.6" r="40.8" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(264.47999999999996 1817.6) scale(1.9799999999999998)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="367.67999999999995" y="1860.8" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="76.8" font-weight="700" fill="#eceef2">Open source</text>
      <text x="367.67999999999995" y="1944.8" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="48" fill="#a2a9b6">GPL-3.0. Read it, build it yourself.</text>
