<text x="540" y="265.3632" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="74.88" font-weight="700" letter-spacing="-0.7488"><tspan fill="#eceef2"></tspan><tspan fill="#5cc8a8">design</tspan><tspan fill="#eceef2"></tspan></text>
    <circle cx="154.07999999999998" cy="463.68" r="24.48" fill="#5cc8a8" opacity="0.16"/>
