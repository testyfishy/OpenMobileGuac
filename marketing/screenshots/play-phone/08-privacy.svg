      <text x="201.6" y="475.2" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="46.08" font-weight="700" fill="#eceef2">No account</text>
      <text x="201.6" y="525.6" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="28.799999999999997" fill="#a2a9b6">The app talks only to the servers you add.</text><circle cx="154.07999999999998" cy="677.76" r="24.48" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(139.68 663.36) scale(1.188)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="201.6" y="689.28" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="46.08" font-weight="700" fill="#eceef2">No ads, no tracking</text>
      <text x="201.6" y="739.68" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="28.799999999999997" fill="#a2a9b6">No analytics, ad or tracking SDKs.</text><circle cx="154.07999999999998" cy="891.8399999999999" r="24.48" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(139.68 877.4399999999999) scale(1.188)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="201.6" y="903.3599999999999" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="46.08" font-weight="700" fill="#eceef2">Your keychain</text>
      <text x="201.6" y="953.7599999999999" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="28.799999999999997" fill="#a2a9b6">Saved passwords stay in secure storage.</text><circle cx="154.07999999999998" cy="1105.92" r="24.48" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(139.68 1091.52) scale(1.188)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="201.6" y="1117.44" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="46.08" font-weight="700" fill="#eceef2">App lock</text>
      <text x="201.6" y="1167.8400000000001" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="28.799999999999997" fill="#a2a9b6">Fingerprint, face unlock or device PIN.</text><circle cx="154.07999999999998" cy="1320" r="24.48" fill="#5cc8a8" opacity="0.16"/>
      <path transform="translate(139.68 1305.6) scale(1.188)" d="M6 13l5 5 13-13" fill="none" stroke="#5cc8a8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="201.6" y="1331.52" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="46.08" font-weight="700" fill="#eceef2">Open source</text>
      <text x="201.6" y="1381.92" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif" font-size="28.799999999999997" fill="#a2a9b6">GPL-3.0. Read it, build it yourself.</text>
