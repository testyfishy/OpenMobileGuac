name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: this job runs the repository's code (npm, Gradle). Publishing the nightly
    # is the separate `publish` job below, which runs no repository code.
    permissions:
      contents: read
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Optional: a base64-encoded debug keystore so every nightly has the same signature
      # and installs over the previous one. See docs/release.md. Never on pull requests:
      # their builds sign with a throwaway key the Android Gradle plugin creates.
      HAS_DEBUG_KEYSTORE: ${{ github.event_name != 'pull_request' && secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_RELEASE_KEYSTORE: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Uses the Android SDK preinstalled on the ubuntu runner image (ANDROID_HOME).
      # Gradle downloads any missing SDK platform/build-tools automatically.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Web build and Capacitor sync
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Debug signing: the stable keystore from secrets, never on pull requests. Without it
      # the Android Gradle plugin signs with a throwaway key. The key is deliberately not
      # kept in the Actions cache: a pull request can edit this file and restore caches
      # saved on the default branch.
      - name: Restore debug keystore from secret
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      # Placeholder for release signing (AAB/APK). Enabled only when the secrets exist.
      # See docs/release.md ("Android release signing").
      - name: Assemble signed release
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true'
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true'
        with:
          name: OpenMobileGuac-release
          path: |
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Rename APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/OpenMobileGuac-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: OpenMobileGuac-debug-apk
          path: ${{ runner.temp }}/out/OpenMobileGuac-debug.apk
          if-no-files-found: error
          retention-days: 30

  # The rolling "nightly" prerelease. The only job with write access, and it never checks
  # out or runs repository code: it takes the APK the build job uploaded and moves the tag
  # and the release through the GitHub API.
  publish:
    name: Publish nightly
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: android-nightly-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenMobileGuac-debug-apk
          path: ${{ runner.temp }}/out

      - name: Move the nightly tag and update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/out/OpenMobileGuac-debug.apk"
          test -f "$apk"
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          notes="Rolling debug build of ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). Not for production use. Install steps: docs/checklists/phase0.md"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly (debug)" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly (debug)" --notes "$notes" --verify-tag
          fi
          gh release upload nightly "$apk" --clobber
