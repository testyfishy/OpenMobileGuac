name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # publishing the rolling "nightly" prerelease
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Optional: a base64-encoded debug keystore so every nightly has the same signature
      # and installs over the previous one. See docs/release.md.
      HAS_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 != '' }}
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Uses the Android SDK preinstalled on the ubuntu runner image (ANDROID_HOME).
      # Gradle downloads any missing SDK platform/build-tools automatically.
      - uses: gradle/actions/setup-gradle@v6

      - name: Web build and Capacitor sync
        run: |
          npm ci
          npm run build
          npx cap sync android

      # Debug signing. Prefer a stable keystore from secrets; otherwise reuse one cached
      # from earlier runs; otherwise create one (and cache it).
      - name: Restore debug keystore from secret
        if: env.HAS_DEBUG_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
      - name: Restore cached debug keystore
        if: env.HAS_DEBUG_KEYSTORE != 'true'
        id: keystore-cache
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Create debug keystore
        if: env.HAS_DEBUG_KEYSTORE != 'true' && steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assemble debug APK
        working-directory: app/android
        run: ./gradlew --no-daemon assembleDebug

      # Placeholder for release signing (AAB/APK). Enabled only when the secrets exist.
      # See docs/release.md ("Android release signing").
      - name: Assemble signed release
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true'
        working-directory: app/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request' && env.HAS_RELEASE_KEYSTORE == 'true'
        with:
          name: OpenMobileGuac-release
          path: |
            app/android/app/build/outputs/apk/release/*.apk
            app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Rename APK
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/OpenMobileGuac-debug.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: OpenMobileGuac-debug-apk
          path: ${{ runner.temp }}/out/OpenMobileGuac-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling nightly prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Rolling debug build of ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). Not for production use. Install steps: docs/checklists/phase0.md"
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly (debug)" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly (debug)" --notes "$notes" --verify-tag
          fi
          gh release upload nightly "$RUNNER_TEMP/out/OpenMobileGuac-debug.apk" --clobber
